name: Generate Snake Animation

on:
  # Chạy tự động mỗi 24 giờ
  schedule:
    - cron: "0 0 * * *"
  
  # Cho phép bấm chạy thủ công trong tab Actions
  workflow_dispatch:
  
  # Tự động chạy mỗi khi bạn update file README
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Lấy dữ liệu commit của bạn và xuất thành file SVG con rắn
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Tự động đẩy file SVG đã tạo vào nhánh 'output'
      - name: Push github-contribution-grid-snake.svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
